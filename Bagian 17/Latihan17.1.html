<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Explorer</title>
    <style>
        .product-card {
            border: 1px solid #ccc;
            padding: 15px;
            margin: 10px;
            border-radius: 8px;
            max-width: 250px;
            display: inline-block;
            vertical-align: top;
            font-family: sans-serif;
        }
        .product-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <h1>Daftar Produk</h1>
    <div id="product-list"></div>

    <script src="script.js"></script>
</body>
</html>
