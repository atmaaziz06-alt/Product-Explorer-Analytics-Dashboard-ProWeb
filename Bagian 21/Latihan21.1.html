<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Product Explorer - State & Modules</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .controls { margin-bottom: 20px; display: flex; gap: 10px; }
        input, select { padding: 8px; font-size: 14px; }
        .product-card {
            border: 1px solid #ccc;
            padding: 15px;
            margin: 10px;
            border-radius: 8px;
            width: 200px;
            display: inline-block;
            vertical-align: top;
        }
        .product-card img { width: 100%; height: 120px; object-fit: cover; border-radius: 4px; }
    </style>
</head>
<body>

    <h1>Product Explorer & Analytics Dashboard</h1>

    <!-- Kontrol Filter & Search (Bagian 19) -->
    <div class="controls">
        <input type="text" id="search-input" placeholder="Cari produk...">
        
        <select id="category-select">
            <option value="all">Semua Kategori</option>
            <option value="laptops">Laptops</option>
            <option value="phones">Phones</option>
            <option value="audio">Audio</option>
            <option value="accessories">Accessories</option>
        </select>

        <select id="sort-select">
            <option value="default">Urutan Default</option>
            <option value="price-asc">Harga: Rendah ke Tinggi</option>
            <option value="price-desc">Harga: Tinggi ke Rendah</option>
            <option value="rating">Rating Tertinggi</option>
            <option value="title">Nama (A-Z)</option>
        </select>
    </div>

    <!-- Tempat Render Produk -->
    <div id="product-list"></div>

    <!-- Panggil main.js sebagai ES Module (Bagian 21) -->
    <script type="module" src="main.js"></script>
</body>
</html>
